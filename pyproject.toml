[project]
name = "lean-llmd"
version = "0.1.0"
description = "Build llm-d's request path in Python on kind, one concept a day, then map each one to real llm-d."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Mei Li", email = "limei1221@gmail.com" },
]
dependencies = [
    "cryptography>=50.0.2",
    "grpcio>=1.70",
    "grpcio-health-checking>=1.70",
    "httpx>=0.28",
    "kubernetes>=33",
    "msgpack>=1.2.3",
    "protobuf>=5",
    "pyyaml>=6",
    "pyzmq>=27.2.0",
    "xds-protos>=1.70",
    "xxhash>=3.5",
]

[project.scripts]
lean-llmd = "lean_llmd_course.cli:main"

[dependency-groups]
dev = ["mypy>=1.17", "prometheus-client>=0.21", "pytest>=8.4", "ruff>=0.12", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lean_llmd", "src/lean_llmd_ref", "src/lean_llmd_course"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs Docker to run the simulator container; skipped otherwise",
    "kind: needs the lean-llmd kind cluster (lean-llmd cluster up); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["k8s"]

[tool.ruff.lint.per-file-ignores]
# The learner's package is generated stubs until they fill it in: imports the
# reference needs are unused until the bodies exist.
"src/lean_llmd/*.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
# The learner's package is theirs; type errors in work-in-progress code are
# noise, not a gate.
files = ["src/lean_llmd_ref", "src/lean_llmd_course", "tools"]
strict = true

[[tool.mypy.overrides]]
module = ["kubernetes.*", "xxhash.*", "envoy.*", "grpc.*", "grpc_health.*", "google.protobuf.*", "msgpack.*", "cryptography.*"]
ignore_missing_imports = true
follow_imports = "skip"
